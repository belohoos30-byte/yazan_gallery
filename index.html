<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yazan Museum</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07121e;font-family:Arial,sans-serif}
canvas{display:block}
#intro{
 position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(ellipse at center,#263e54 0%,#101d2b 48%,#050b12 100%);
 color:#edf7ff;text-align:center;transition:opacity .8s;
}
.intro-box{padding:35px 25px}
.intro-title{font-family:Georgia,serif;font-size:clamp(32px,7vw,66px);letter-spacing:8px;font-weight:400}
.intro-line{width:90px;height:1px;background:#b8d7e9;margin:28px auto}
#enter{
 border:1px solid #b9d8e8;background:transparent;color:#edf7ff;
 padding:14px 34px;letter-spacing:3px;font-size:12px;cursor:pointer;
 transition:.25s
}
#enter:hover{background:#d8efff;color:#102235}
#hint{
 position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:3;
 color:#eaf5ff;background:#07121ebd;border:1px solid #ffffff28;
 padding:9px 15px;border-radius:20px;font-size:12px;pointer-events:none;
 text-align:center;max-width:90%;white-space:nowrap
}
#roomName{
 position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
 color:#e8f5ff;background:#07121edb;border:1px solid #ffffff30;
 border-radius:20px;padding:10px 17px;font-size:12px;z-index:3;
 pointer-events:none;text-align:center
}
#controls{
 position:fixed;bottom:18px;right:18px;z-index:4;
 display:grid;grid-template-columns:repeat(3,48px);gap:5px;
}
#controls button{
 height:45px;border:1px solid #d9efff55;border-radius:12px;
 color:white;background:#10283bbd;font-size:19px;touch-action:none
}
#controls button:active{background:#507c9d}
#look{
 position:fixed;left:12px;bottom:20px;z-index:4;color:#eaf5ff;
 font-size:11px;background:#07121ebd;padding:10px 12px;border-radius:12px;
 border:1px solid #ffffff28;max-width:145px;line-height:1.5
}
#interaction{
 position:fixed;left:50%;top:56%;transform:translate(-50%,-50%);
 z-index:5;color:white;background:#0b1c2ddd;border:1px solid #d7edff88;
 padding:13px 18px;border-radius:12px;display:none;text-align:center;
 max-width:85%;font-size:13px;line-height:1.5
}
#interaction button{
 margin-top:9px;background:#d9edf8;color:#10283b;border:0;
 border-radius:8px;padding:8px 15px;cursor:pointer
}
#closeInfo{
 position:absolute;right:10px;top:7px;border:0;background:transparent;
 color:inherit;font-size:18px;cursor:pointer
}
#infoText{white-space:pre-line}
@media(max-width:600px){
 #look{max-width:125px;font-size:10px}
 #controls{right:10px;bottom:12px}
 #roomName{bottom:155px}
}
</style>
</head>
<body>

<div id="intro">
 <div class="intro-box">
  <div class="intro-title">YAZAN MUSEUM</div>
  <div class="intro-line"></div>
  <button id="enter">ENTER THE MUSEUM</button>
 </div>
</div>

<div id="hint">WASD to move · Drag to look around · Tap objects to explore</div>
<div id="roomName">The Entrance</div>
<div id="look">Move: WASD or arrows<br>Look: drag the screen</div>
<div id="interaction">
 <button id="closeInfo">×</button>
 <div id="infoText"></div>
</div>

<div id="controls">
 <span></span><button data-key="w">↑</button><span></span>
 <button data-key="a">←</button><button data-key="s">↓</button><button data-key="d">→</button>
</div>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.152.2';
import { GLTFLoader } from 'https://esm.sh/three@0.152.2/examples/jsm/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101e2d);
scene.fog = new THREE.Fog(0x101e2d, 35, 125);

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, .1, 250);
camera.position.set(0,1.7,7);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xcce7ff,0x26303a,2));
const mainLight = new THREE.DirectionalLight(0xffedcf,2.3);
mainLight.position.set(5,12,8);
mainLight.castShadow = true;
scene.add(mainLight);

const blueLight = new THREE.PointLight(0x72c9ff,45,45);
blueLight.position.set(0,5,0);
scene.add(blueLight);

const mat = (color,rough=.65,metal=0)=>new THREE.MeshStandardMaterial({
 color,roughness:rough,metalness:metal
});
const marble=mat(0xdce8ed,.23,.22);
const dark=mat(0x17283a,.42,.25);
const gold=mat(0xc9a86a,.3,.72);
const blue=mat(0x5a91b5,.35,.35);
const wood=mat(0x62452f,.65);
const black=mat(0x10151b,.35);
const white=mat(0xf0f2ee,.45);
const red=mat(0x8d292c,.45);
const green=mat(0x3e694f,.7);
const glass=new THREE.MeshPhysicalMaterial({
 color:0x9bd9ee,transparent:true,opacity:.27,roughness:.1,metalness:.15
});

const rooms=[
 ["The Entrance","The beginning of the journey."],
 ["Childhood","Small things, unforgettable memories."],
 ["The Mind","Questions, ideas and discoveries."],
 ["Music","A soundtrack for different seasons of life."],
 ["Germany","A destination and an open horizon."],
 ["Barcelona","A childhood football dream."],
 ["History","Civilizations, time and human stories."],
 ["The Stars","Sagittarius and the night sky."],
 ["Sports","Movement, discipline and energy."],
 ["The World","Politics, technology and critical thought."],
 ["Writing","Words that preserve passing moments."],
 ["Watching","Stories, screens and familiar voices."],
 ["The Archive","A room for secrets and memories."],
 ["Twenty-One","A new chapter, with many doors ahead."]
];

const roomGroups=[];
const interactables=[];
const roomWidth=20;
const roomDepth=20;
const spacing=24;

function box(parent,x,y,z,w,h,d,material,opts={}){
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 mesh.position.set(x,y,z);
 mesh.castShadow=true;mesh.receiveShadow=true;
 parent.add(mesh);
 if(opts.info)register(mesh,opts.info);
 return mesh;
}
function sphere(parent,x,y,z,r,material,scale=[1,1,1],info=null){
 const mesh=new THREE.Mesh(new THREE.SphereGeometry(r,20,16),material);
 mesh.position.set(x,y,z);mesh.scale.set(...scale);
 mesh.castShadow=true;parent.add(mesh);
 if(info)register(mesh,info);
 return mesh;
}
function cylinder(parent,x,y,z,rt,rb,h,material,info=null){
 const mesh=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,24),material);
 mesh.position.set(x,y,z);mesh.castShadow=true;parent.add(mesh);
 if(info)register(mesh,info);
 return mesh;
}
function register(obj,info){
 obj.userData.info=info;
 interactables.push(obj);
}
function textPanel(parent,x,y,z,title,description){
 const canvas=document.createElement('canvas');
 canvas.width=1024;canvas.height=300;
 const c=canvas.getContext('2d');
 c.fillStyle='#102337';c.fillRect(0,0,1024,300);
 c.strokeStyle='#c8b17d';c.lineWidth=5;c.strokeRect(18,18,988,264);
 c.fillStyle='#f0e6ce';c.textAlign='center';
 c.font='bold 48px Georgia';c.fillText(title,512,115);
 c.font='28px Arial';c.fillText(description.slice(0,65),512,190);
 const tex=new THREE.CanvasTexture(canvas);
 const panel=new THREE.Mesh(new THREE.PlaneGeometry(7,2.05),
 new THREE.MeshBasicMaterial({map:tex}));
 panel.position.set(x,y,z);parent.add(panel);
 return panel;
}
function column(parent,x,z){
 cylinder(parent,x,1.65,z,.53,.62,3.3,marble);
 cylinder(parent,x,3.34,z,.82,.82,.22,gold);
 cylinder(parent,x,.12,z,.83,.83,.24,gold);
 cylinder(parent,x,3.52,z,.7,.7,.17,marble);
}
function chandelier(parent,x,z){
 cylinder(parent,x,5.5,z,.08,.08,1.1,gold);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(1.1,.075,8,32),gold);
 ring.rotation.x=Math.PI/2;ring.position.set(x,4.9,z);parent.add(ring);
 for(let i=0;i<8;i++){
  const a=i*Math.PI/4;
  const px=x+Math.cos(a)*1.1,pz=z+Math.sin(a)*1.1;
  cylinder(parent,px,4.65,pz,.09,.12,.42,white);
  const light=new THREE.PointLight(0xffdba0,2,5);
  light.position.set(px,4.5,pz);parent.add(light);
 }
}
function buildRoom(index){
 const group=new THREE.Group();
 group.position.x=index*spacing;
 scene.add(group);roomGroups.push(group);

 box(group,0,-.2,0,20,.4,20,marble);
 box(group,0,6,0,20,.35,20,dark);

 // Walls
 box(group,0,3,-10,20,6,.45,dark);
 box(group,-10,3,0,.45,6,20,dark);
 box(group,10,3,0,.45,6,20,dark);
 // Door openings at the front and rear
 box(group,-7,3,10,.7,6,.45,dark);
 box(group,7,3,10,.7,6,.45,dark);
 box(group,-7,3,-10,.7,6,.45,dark);
 box(group,7,3,-10,.7,6,.45,dark);

 for(const x of [-8.5,-4.5,4.5,8.5]){
  column(group,x,-8.7);column(group,x,8.7);
 }
 chandelier(group,0,0);
 textPanel(group,0,4.6,-9.72,rooms[index][0],rooms[index][1]);
 // Decorative arches
 for(const x of [-5,5]){
  const arch=new THREE.Mesh(new THREE.TorusGeometry(2.1,.16,12,32,Math.PI),gold);
  arch.position.set(x,3.2,9.72);arch.rotation.z=Math.PI;
  group.add(arch);
 }
 return group;
}

function table(parent,x,z,w=3,d=1.5){
 box(parent,x,.95,z,w,.18,d,wood);
 for(const dx of [-w/2+.15,w/2-.15])
  for(const dz of [-d/2+.15,d/2-.15])
   box(parent,x+dx,.45,z+dz,.15,.9,.15,dark);
}
function book(parent,x,y,z,color=red,title='A book'){
 const b=box(parent,x,y,z,.75,.16,.95,mat(color,.8),{info:title+'\nA small object in the museum.'});
 box(parent,x,y+.09,z,.04,.02,.9,gold);
 return b;
}
function chair(parent,x,z,color=red){
 box(parent,x,.65,z,.9,.18,.9,mat(color));
 box(parent,x,.55,z-.42,.9,1,.14,mat(color));
 for(const dx of [-.34,.34])for(const dz of [-.3,.3])
  box(parent,x+dx,.28,z+dz,.12,.55,.12,wood);
}
function screen(parent,x,y,z,w,h,color=0x68b8d9){
 box(parent,x,y,z,w,h,.13,black);
 const display=new THREE.Mesh(new THREE.PlaneGeometry(w*.87,h*.82),
 new THREE.MeshBasicMaterial({color}));
 display.position.set(x,y,z+.075);parent.add(display);
 return display;
}
function ball(parent,x,y,z,r=0.48){
 const b=sphere(parent,x,y,z,r,white,[1,1,1],
 'Football\nA reminder of the dream of playing football.');
 for(let i=0;i<5;i++){
  const a=i*Math.PI*2/5;
  sphere(parent,x+Math.cos(a)*r*.72,y,z+Math.sin(a)*r*.72,r*.22,black);
 }
 return b;
}
function makeCat(parent,x,z){
 const cat=new THREE.Group();cat.position.set(x,0,z);parent.add(cat);
 sphere(cat,0,.65,0,.48,mat(0xc58c55),[1,.8,1],
 'Basboos\nA sandy ginger street cat with hazel eyes.');
 sphere(cat,0,1.35,.05,.4,mat(0xc58c55),[1,1,1]);
 sphere(cat,-.15,1.4,.38,.055,mat(0x8d6d35));
 sphere(cat,.15,1.4,.38,.055,mat(0x8d6d35));
 const ear1=new THREE.Mesh(new THREE.ConeGeometry(.16,.35,4),mat(0xc58c55));
 ear1.position.set(-.25,1.72,.02);cat.add(ear1);
 const ear2=ear1.clone();ear2.position.x=.25;cat.add(ear2);
 sphere(cat,-.14,1.39,.4,.045,mat(0x594b2e));
 sphere(cat,.14,1.39,.4,.045,mat(0x594b2e));
 cylinder(cat,0,1.27,.43,.07,.07,.06,mat(0x8b5549));
 const tail=new THREE.Mesh(new THREE.TorusGeometry(.42,.09,8,24,Math.PI),mat(0xc58c55));
 tail.position.set(.45,.5,-.2);tail.rotation.z=.4;cat.add(tail);
 return cat;
}
function addWindow(parent,x,z){
 box(parent,x,3.1,z,.15,4.2,4.2,gold);
 box(parent,x,3.1,z+.1,.12,3.85,3.85,glass);
 box(parent,x,3.1,z+.2,.1,.08,3.9,gold);
 box(parent,x,3.1,z+.2,.1,3.9,.08,gold);
}
function addGlobe(parent,x,y,z){
 sphere(parent,x,y,z,.75,blue);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.9,.035,8,48),gold);
 ring.position.set(x,y,z);ring.rotation.x=.7;parent.add(ring);
}
function addRoomDecoration(g,i){
 switch(i){
 case 0:
  table(g,0,0,4,2);
  makeCat(g,-3,1);
  box(g,0,1.7,0,1.8,.18,.8,gold);
  textPanel(g,0,3.7,-3,'WELCOME','The journey begins here.');
  break;
 case 1:
  // Childhood and games
  table(g,-5,-2,3,1.5);screen(g,-5,2,-2,2.1,1.6,0x69a5b2);
  box(g,-5,1,-2,2.5,.4,1.8,black,{info:'Old computer\nA memory of early computer games.'});
  table(g,0,-1,3,1.4);screen(g,0,2,-1,2.3,1.7,0x8a9aab);
  box(g,0,.8,-1,2.5,.3,1.5,black,{info:'CRT television and consoles\nPS1, PS2, games and old discs.'});
  for(let j=0;j<4;j++)cylinder(g,-1.1+j*.7,1.35,-1,.32,.32,.08,white);
  table(g,5,2,2.8,1.5);
  for(let j=0;j<5;j++)box(g,4+j*.45,1.3,2,.22,.55,.22,green);
  book(g,-5,1.5,3,0x8f3d36,'Cartoon memories');
  book(g,-3.8,1.5,3,0x337a91,'Spacetoon');
  book(g,4,1.5,3,0x6c4b8b,'Chalk world');
  table(g,0,4,2.5,1.1);
  box(g,0,1.2,4,.18,.08,.7,mat(0xb18c74),{
   info:'A little piece of the past.\nA small lock of hair, kept as a memory.'
  });
  const scissors=new THREE.Group();scissors.position.set(.5,1.3,4);g.add(scissors);
  const s1=new THREE.Mesh(new THREE.TorusGeometry(.22,.035,8,24),gold);
  s1.position.x=-.12;scissors.add(s1);
  const s2=s1.clone();s2.position.x=.25;scissors.add(s2);
  break;
 case 2:
  table(g,0,0,5,2);
  book(g,-1,1.2,0,0x274c68,'Plato');
  book(g,0,1.2,0,0x563c4c,'Nietzsche');
  book(g,1,1.2,0,0x786342,'Tesla');
  sphere(g,0,2.3,0,.48,gold);
  textPanel(g,0,4,-4,'THE MIND','Questions are part of the journey.');
  break;
 case 3:
  addWindow(g,0,-9.65);
  table(g,0,1,4,2);
  for(let j=0;j<6;j++){
   cylinder(g,-1.5+j*.6,1.3,1,.23,.23,.12,gold);
  }
  chair(g,-3,2);chair(g,3,2);
  textPanel(g,0,4,-4,'MUSIC','A soundtrack for different seasons.');
  break;
 case 4:
  addGlobe(g,0,2,0);
  table(g,-4,0,2.5,1.3);
  box(g,-4,1.5,0,.7,.8,.08,white,{info:'Travel documents\nPassports, tickets and plans for Germany.'});
  for(let j=0;j<2;j++){
   box(g,3+j*1.3,.8,0,.9,1.5,.7,mat(j?0x5c7b8c:0x8b674c),
   {info:'Suitcase\nA journey waiting to happen.'});
  }
  break;
 case 5:
  // Barcelona
  ball(g,0,.65,0);
  box(g,-3,1.4,-1,1.2,1.5,.15,mat(0x243e9b),{
   info:'Barcelona shirt\nA childhood dream of becoming a football player.'
  });
  box(g,3,1.4,-1,1.2,1.5,.15,mat(0x9e2537),{
   info:'Yazan shirt\nA shirt with a name and a dream.'
  });
  for(let j=0;j<2;j++){
   box(g,-2+j*4,.25,3,.8,.35,1.6,black,{info:'Football boots'});
  }
  break;
 case 6:
  // History
  for(let j=0;j<3;j++){
   const p=new THREE.Mesh(new THREE.ConeGeometry(1.2,2.4,4),mat(0xc9b48e));
   p.position.set(-4+j*4,1.2,0);p.rotation.y=Math.PI/4;g.add(p);
  }
  for(let j=0;j<4;j++)column(g,-7+j*4,-4);
  sphere(g,0,4,3,1.1,mat(0x8ebbd4),[1,.5,.3]);
  textPanel(g,0,4,-5,'HISTORY','Civilizations, oceans, ice and the moon.');
  break;
 case 7:
  // Stars
  const sky=new THREE.Mesh(new THREE.SphereGeometry(5,32,24),
   new THREE.MeshBasicMaterial({color:0x101d42,side:THREE.BackSide}));
  sky.position.y=2;g.add(sky);
  for(let j=0;j<80;j++){
   const x=(Math.random()-.5)*17,y=1+Math.random()*4,z=(Math.random()-.5)*15;
   sphere(g,x,y,z,.035,white);
  }
  const star=new THREE.Mesh(new THREE.OctahedronGeometry(.8),gold);
  star.position.set(0,3,0);g.add(star);
  textPanel(g,0,4,-5,'SAGITTARIUS','A symbol in the night sky.');
  break;
 case 8:
  table(g,0,1,4,2);
  for(let j=0;j<3;j++){
   cylinder(g,-2+j*2,.7,1,.35,.35,1.3,blue);
  }
  ball(g,0,1.1,-1);
  textPanel(g,0,4,-5,'SPORTS','Movement, discipline and energy.');
  break;
 case 9:
  table(g,0,0,5,2);
  for(let j=0;j<4;j++)book(g,-1.5+j,1.2,0,[0x7d3e35,0x274c68,0x64734c,0x80633c][j]);
  addGlobe(g,4,2,2);
  textPanel(g,0,4,-5,'THE WORLD','Politics, technology and critical thought.');
  break;
 case 10:
  table(g,0,0,4,2);
  book(g,-1,1.2,0,0x4c292e,'Poetry');
  book(g,0,1.2,0,0x304a60,'Writing');
  book(g,1,1.2,0,0x756044,'Notebook');
  box(g,2,1.3,0,.1,.9,.1,gold);
  sphere(g,2,1.8,0,.2,mat(0xffd58c));
  textPanel(g,0,4,-5,'WRITING','Words can hold what time cannot.');
  break;
 case 11:
  // Watching
  box(g,0,.7,-2,5,.8,1.5,mat(0x374b5d));
  box(g,-2,.7,0,1.3,.8,1.3,mat(0x374b5d));
  box(g,2,.7,0,1.3,.8,1.3,mat(0x374b5d));
  screen(g,0,2.7,-4,4.5,2.5,0x304c6b);
  table(g,0,.5,2,1);
  sphere(g,0,1.2,.5,.3,mat(0xf2d8a6));
  textPanel(g,0,4,-7,'WATCHING','Stories, screens and familiar voices.');
  break;
 case 12:
  table(g,0,0,5,2);
  chair(g,-3,2,dark.color);chair(g,3,2);
  box(g,0,1.4,0,1.4,.18,1,gold,{info:'The archive desk\nA place for private memories and old stories.'});
  book(g,-1,1.6,0,0x4b3c37,'The archive');
  book(g,1,1.6,0,0x344d62,'Notes');
  textPanel(g,0,4,-5,'THE ARCHIVE','Some memories remain between the lines.');
  break;
 case 13:
  // Ending
  makeCat(g,4,3);
  sphere(g,0,3,0,1.1,mat(0x8fb7ca),[1.3,1.3,1.3],
   'A new chapter\nTwenty-one years, and many doors still unopened.');
  const ring=new THREE.Mesh(new THREE.TorusGeometry(1.8,.055,10,64),gold);
  ring.position.set(0,3,0);g.add(ring);
  textPanel(g,0,4,-5,'26 NOVEMBER 2026','Twenty-one years. Many doors ahead.');
  break;
 }
}

rooms.forEach((r,i)=>{
 const g=buildRoom(i);
 addRoomDecoration(g,i);
});

// Doorway corridor floor between rooms
for(let i=0;i<rooms.length-1;i++){
 box(scene,(i+.5)*spacing,-.23,0,4,.3,5,marble);
}

// Load optional 3D assets. Procedural objects remain if loading fails.
const loader=new GLTFLoader();
function loadModel(url,parent,position,height,info){
 loader.load(url,gltf=>{
  const model=gltf.scene;
  const bounds=new THREE.Box3().setFromObject(model);
  const size=bounds.getSize(new THREE.Vector3());
  const scale=height/Math.max(size.y,.001);
  model.scale.setScalar(scale);
  const newBounds=new THREE.Box3().setFromObject(model);
  model.position.set(position[0],-newBounds.min.y,position[2]);
  model.traverse(o=>{
   if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}
  });
  parent.add(model);
  register(model,info);
 },undefined,()=>{});
}
loadModel(
 'https://tevy.dev/models/football/v1/lod0.glb',
 roomGroups[5],[0,0,0],1,
 'Football\nA symbol of a childhood dream.'
);
loadModel(
 'https://tevy.dev/models/game-console/v1/lod0.glb',
 roomGroups[1],[3,0,0],1,
 'Game console\nA memory of gaming days.'
);

// Player and movement
let yaw=0,pitch=0;
const keys={};
let movingTouch={};
let dragging=false,lastX=0,lastY=0;
let currentRoom=0;
let targetInfo=null;

function updateRoom(){
 const n=Math.max(0,Math.min(13,Math.round(camera.position.x/spacing)));
 if(n!==currentRoom){
  currentRoom=n;
  document.getElementById('roomName').textContent=rooms[n][0];
 }
}
function clampPlayer(){
 camera.position.x=Math.max(-8.5,Math.min(8.5+13*spacing,camera.position.x));
 camera.position.z=Math.max(-8.7,Math.min(8.7,camera.position.z));
 camera.position.y=1.7;
}
function movement(dt){
 const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 const speed=5.3*dt;
 let move=new THREE.Vector3();
 if(keys.w||keys.ArrowUp||movingTouch.w)move.add(forward);
 if(keys.s||keys.ArrowDown||movingTouch.s)move.sub(forward);
 if(keys.d||keys.ArrowRight||movingTouch.d)move.add(right);
 if(keys.a||keys.ArrowLeft||movingTouch.a)move.sub(right);
 if(move.lengthSq()>0){
  move.normalize().multiplyScalar(speed);
  camera.position.add(move);
 }
 clampPlayer();
 updateRoom();
}
function updateCamera(){
 camera.rotation.order='YXZ';
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;
}
document.addEventListener('keydown',e=>{
 keys[e.key]=true;
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
});
document.addEventListener('keyup',e=>keys[e.key]=false);

document.querySelectorAll('#controls button').forEach(btn=>{
 const key=btn.dataset.key;
 btn.addEventListener('pointerdown',e=>{
  e.preventDefault();movingTouch[key]=true;
 });
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>
  btn.addEventListener(ev,()=>movingTouch[key]=false)
 );
});

renderer.domElement.addEventListener('pointerdown',e=>{
 dragging=true;lastX=e.clientX;lastY=e.clientY;
});
window.addEventListener('pointerup',()=>dragging=false);
window.addEventListener('pointermove',e=>{
 if(!dragging)return;
 const dx=e.clientX-lastX,dy=e.clientY-lastY;
 lastX=e.clientX;lastY=e.clientY;
 yaw-=dx*.004;
 pitch-=dy*.003;
 pitch=Math.max(-1.25,Math.min(1.25,pitch));
 updateCamera();
});

// Object interaction by tapping/clicking
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
function showInfo(info){
 document.getElementById('infoText').textContent=info;
 document.getElementById('interaction').style.display='block';
}
document.getElementById('closeInfo').addEventListener('click',()=>{
 document.getElementById('interaction').style.display='none';
});
renderer.domElement.addEventListener('click',e=>{
 if(dragging)return;
 pointer.x=(e.clientX/innerWidth)*2-1;
 pointer.y=-(e.clientY/innerHeight)*2+1;
 raycaster.setFromCamera(pointer,camera);
 const hits=raycaster.intersectObjects(scene.children,true);
 for(const hit of hits){
  let obj=hit.object;
  while(obj){
   if(obj.userData.info){showInfo(obj.userData.info);return;}
   obj=obj.parent;
  }
 }
});

// Click the room label to go to the next room
document.getElementById('roomName').addEventListener('click',()=>{
 const next=(currentRoom+1)%rooms.length;
 camera.position.x=next*spacing;
 camera.position.z=6;
 yaw=0;pitch=0;updateCamera();updateRoom();
});

document.getElementById('enter').addEventListener('click',()=>{
 const intro=document.getElementById('intro');
 intro.style.opacity='0';
 setTimeout(()=>intro.remove(),850);
 camera.position.set(0,1.7,6);
 yaw=0;pitch=0;updateCamera();
});

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 movement(dt);
 updateCamera();
 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
