<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>متحف يزن الرقمي</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07121e;font-family:Arial,sans-serif}
canvas{display:block;touch-action:none}
#hint,#roomName,#look,#interaction,#controls,#error{
 position:fixed;z-index:5;color:#edf7ff;background:#071a2bdc;
 border:1px solid #d8edff44;backdrop-filter:blur(8px)
}
#hint{top:12px;left:50%;transform:translateX(-50%);padding:9px 14px;border-radius:20px;font-size:12px;text-align:center;max-width:94%}
#roomName{bottom:15px;left:50%;transform:translateX(-50%);padding:10px 17px;border-radius:20px;font-size:13px}
#look{bottom:15px;left:12px;padding:10px;border-radius:12px;font-size:11px;line-height:1.6;max-width:145px}
#controls{bottom:12px;right:12px;padding:7px;border-radius:15px;display:grid;grid-template-columns:repeat(3,46px);gap:4px}
#controls button{height:44px;border:1px solid #cdeaff55;border-radius:10px;background:#17354c;color:white;font-size:20px;touch-action:none}
#controls button:active{background:#426b8a}
#interaction{display:none;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,88%);padding:22px 17px 16px;border-radius:16px;text-align:center;line-height:1.8}
#infoText{white-space:pre-line;font-size:14px}
#closeInfo{position:absolute;left:9px;top:5px;border:0;background:none;color:white;font-size:24px}
#error{display:none;inset:15px;padding:18px;border-radius:14px;overflow:auto;line-height:1.7}
@media(max-width:600px){
 #look{max-width:112px;font-size:10px}
 #roomName{bottom:158px}
 #hint{font-size:10px}
}
</style>
</head>
<body>
<div id="hint">تحرّك بالأسهم أو WASD · اسحب الشاشة للنظر حولك · اضغط على المعروضات</div>
<div id="roomName">المدخل</div>
<div id="look">الحركة: الأزرار<br>النظر: اسحب الشاشة</div>
<div id="controls">
 <span></span><button data-key="w">↑</button><span></span>
 <button data-key="a">←</button><button data-key="s">↓</button><button data-key="d">→</button>
</div>
<div id="interaction">
 <button id="closeInfo">×</button>
 <div id="infoText"></div>
</div>
<div id="error"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js';

const errorBox=document.getElementById('error');
try{
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101e2d);
scene.fog=new THREE.Fog(0x101e2d,45,150);

const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,300);
camera.position.set(0,1.7,6);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xcce7ff,0x26303a,2));
const sun=new THREE.DirectionalLight(0xffedcf,2.1);
sun.position.set(5,12,8);
sun.castShadow=true;
scene.add(sun);

const blueLight=new THREE.PointLight(0x72c9ff,35,55);
blueLight.position.set(0,5,0);
scene.add(blueLight);

const material=(color,roughness=.65,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const marble=material(0xdce8ed,.23,.2);
const dark=material(0x17283a,.45,.25);
const gold=material(0xc9a86a,.3,.7);
const blue=material(0x5a91b5,.35,.3);
const wood=material(0x62452f,.7);
const black=material(0x10151b,.4);
const white=material(0xf0f2ee,.45);
const green=material(0x3e694f,.7);
const glass=new THREE.MeshPhysicalMaterial({color:0x9bd9ee,transparent:true,opacity:.3,roughness:.1});

const rooms=[
["المدخل","بداية الرحلة… ومكان ترحيب بَسبوس."],
["الطفولة والألعاب","أشياء صغيرة بقيت ذكرياتها كبيرة."],
["الفكر والأسئلة","الفلسفة والأسئلة والاكتشاف."],
["الموسيقى","موسيقى ترافق فصول الحياة."],
["ألمانيا","وجهة وأفق مفتوح."],
["برشلونة","حلم كرة القدم منذ الطفولة."],
["التاريخ والحضارات","حضارات وأزمنة وقصص بشرية."],
["النجوم والقوس","رمز القوس ♐ وليالي السماء."],
["الرياضة","حركة وانضباط وطاقة."],
["العالم والتقنية","سياسة وتقنية وتفكير نقدي."],
["الكتابة","كلمات تحفظ اللحظات."],
["المشاهدة","شاشات وحكايات وأصوات مألوفة."],
["الأرشيف","ذكريات وأسرار بين السطور."],
["الحادي والعشرون","26 نوفمبر 2026 · بداية فصل جديد."]
];

const roomWidth=20,spacing=24,roomGroups=[];
const clickable=[];

function box(parent,x,y,z,w,h,d,mat,info){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);
 if(info){m.userData.info=info;clickable.push(m)}
 return m;
}
function sphere(parent,x,y,z,r,mat,scale=[1,1,1],info){
 const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,16),mat);
 m.position.set(x,y,z);m.scale.set(...scale);m.castShadow=true;parent.add(m);
 if(info){m.userData.info=info;clickable.push(m)}
 return m;
}
function cylinder(parent,x,y,z,rt,rb,h,mat,info){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,24),mat);
 m.position.set(x,y,z);m.castShadow=true;parent.add(m);
 if(info){m.userData.info=info;clickable.push(m)}
 return m;
}
function textPanel(parent,x,y,z,title,description){
 const canvas=document.createElement('canvas');canvas.width=1024;canvas.height=300;
 const c=canvas.getContext('2d');
 c.fillStyle='#102337';c.fillRect(0,0,1024,300);
 c.strokeStyle='#c8b17d';c.lineWidth=5;c.strokeRect(18,18,988,264);
 c.fillStyle='#f0e6ce';c.textAlign='center';
 c.font='bold 48px Arial';c.fillText(title,512,115);
 c.font='28px Arial';c.fillText(description.slice(0,65),512,190);
 const tex=new THREE.CanvasTexture(canvas);
 const panel=new THREE.Mesh(new THREE.PlaneGeometry(7,2.05),new THREE.MeshBasicMaterial({map:tex}));
 panel.position.set(x,y,z);parent.add(panel);
}
function column(parent,x,z){
 cylinder(parent,x,1.65,z,.53,.62,3.3,marble);
 cylinder(parent,x,3.34,z,.82,.82,.22,gold);
 cylinder(parent,x,.12,z,.83,.83,.24,gold);
 cylinder(parent,x,3.52,z,.7,.7,.17,marble);
}
function chandelier(parent,x,z){
 cylinder(parent,x,5.5,z,.08,.08,1.1,gold);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(1.1,.075,8,32),gold);
 ring.rotation.x=Math.PI/2;ring.position.set(x,4.9,z);parent.add(ring);
 for(let i=0;i<8;i++){
  const a=i*Math.PI/4,px=x+Math.cos(a)*1.1,pz=z+Math.sin(a)*1.1;
  cylinder(parent,px,4.65,pz,.09,.12,.42,white);
  const l=new THREE.PointLight(0xffdba0,1.5,5);l.position.set(px,4.5,pz);parent.add(l);
 }
}
function table(parent,x,z,w=3,d=1.5){
 box(parent,x,.95,z,w,.18,d,wood);
 for(const dx of [-w/2+.15,w/2-.15])for(const dz of [-d/2+.15,d/2-.15])
  box(parent,x+dx,.45,z+dz,.15,.9,.15,dark);
}
function book(parent,x,y,z,color=0x8f3d36,title='كتاب'){
 return box(parent,x,y,z,.75,.16,.95,material(color,.8),title+'\nذكرى صغيرة في متحف يزن.');
}
function screen(parent,x,y,z,w,h,color=0x68b8d9,info='شاشة قديمة'){
 box(parent,x,y,z,w,h,.13,black);
 const display=new THREE.Mesh(new THREE.PlaneGeometry(w*.87,h*.82),new THREE.MeshBasicMaterial({color}));
 display.position.set(x,y,z+.075);parent.add(display);
 const hit=box(parent,x,y,z+.09,w*.86,h*.8,0.025,material(color),info);
 return hit;
}
function ball(parent,x,y,z){
 const b=sphere(parent,x,y,z,.48,white,[1,1,1],'كرة قدم\nتذكير بحلم الطفولة في أن يصبح يزن لاعب كرة قدم.');
 for(let i=0;i<5;i++){const a=i*Math.PI*2/5;sphere(parent,x+Math.cos(a)*.34,y,z+Math.sin(a)*.34,.1,black)}
 return b;
}
function makeCat(parent,x,z){
 const cat=new THREE.Group();cat.position.set(x,0,z);parent.add(cat);
 sphere(cat,0,.65,0,.48,material(0xc58c55),[1,.8,1],'بَسبوس\nقط بلون رملي مائل للزنجبيل وعينين عسليتين.');
 sphere(cat,0,1.35,.05,.4,material(0xc58c55));
 sphere(cat,-.15,1.4,.38,.055,material(0x8d6d35));
 sphere(cat,.15,1.4,.38,.055,material(0x8d6d35));
 for(const x of [-.25,.25]){
  const ear=new THREE.Mesh(new THREE.ConeGeometry(.16,.35,4),material(0xc58c55));
  ear.position.set(x,1.72,.02);cat.add(ear);
  sphere(cat,x*.55,1.39,.4,.045,material(0x594b2e));
 }
 const tail=new THREE.Mesh(new THREE.TorusGeometry(.42,.09,8,24,Math.PI),material(0xc58c55));
 tail.position.set(.45,.5,-.2);tail.rotation.z=.4;cat.add(tail);
}
function addWindow(parent,x,z){
 box(parent,x,3.1,z,.15,4.2,4.2,gold);
 box(parent,x,3.1,z+.1,.12,3.85,3.85,glass);
 box(parent,x,3.1,z+.2,.1,.08,3.9,gold);
 box(parent,x,3.1,z+.2,.1,3.9,.08,gold);
}
function addGlobe(parent,x,y,z){
 sphere(parent,x,y,z,.75,blue,[1,1,1],'كرة أرضية\nنافذة رمزية على العالم والسفر.');
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.9,.035,8,48),gold);
 ring.position.set(x,y,z);ring.rotation.x=.7;parent.add(ring);
}
function chair(parent,x,z){
 const m=material(0x8d292c);
 box(parent,x,.65,z,.9,.18,.9,m);box(parent,x,.55,z-.42,.9,1,.14,m);
 for(const dx of [-.34,.34])for(const dz of [-.3,.3])box(parent,x+dx,.28,z+dz,.12,.55,.12,wood);
}
function buildRoom(index){
 const g=new THREE.Group();g.position.x=index*spacing;scene.add(g);roomGroups.push(g);
 box(g,0,-.2,0,20,.4,20,marble);
 box(g,0,6,0,20,.35,20,dark);
 box(g,0,3,-10,20,6,.45,dark);
 box(g,-10,3,0,.45,6,20,dark);
 box(g,10,3,0,.45,6,20,dark);
 // جدار أمامي مع فتحة باب وسطية
 box(g,-7,3,10,6,6,.45,dark);
 box(g,7,3,10,6,6,.45,dark);
 box(g,0,5.35,10,8,1.3,.45,dark);
 for(const x of [-8.5,-4.5,4.5,8.5]){column(g,x,-8.7);column(g,x,8.7)}
 chandelier(g,0,0);
 textPanel(g,0,4.6,-9.72,rooms[index][0],rooms[index][1]);
 return g;
}
function decorate(g,i){
 switch(i){
 case 0:
  table(g,0,0,4,2);makeCat(g,-3,1);
  box(g,0,1.7,0,1.8,.18,.8,gold,'طاولة المدخل');
  textPanel(g,0,3.7,-3,'أهلاً بك','المتحف يشبهه، مو يوثّقه.');
  break;
 case 1:
  table(g,-5,-2,3,1.5);screen(g,-5,2,-2,2.1,1.6,0x69a5b2,'كمبيوتر LG قديم\nذكريات ألعاب الكمبيوتر وGTA San Andreas.');
  table(g,0,-1,3,1.4);screen(g,0,2,-1,2.3,1.7,0x8a9aab,'تلفزيون CRT وأجهزة PS1 وPS2\nألعاب وذكريات من أيام الطفولة.');
  for(let j=0;j<4;j++)cylinder(g,-1.1+j*.7,1.35,-1,.32,.32,.08,white,'قرص ألعاب قديم');
  table(g,5,2,2.8,1.5);
  for(let j=0;j<5;j++)box(g,4+j*.45,1.3,2,.22,.55,.22,green,'مجسم جندي أخضر');
  book(g,-5,1.5,3,0x8f3d36,'عالم الطباشير');
  book(g,-3.8,1.5,3,0x337a91,'سبيستون');
  book(g,4,1.5,3,0x6c4b8b,'ذكريات الكرتون');
  table(g,0,4,2.5,1.1);
  box(g,0,1.2,4,.18,.08,.7,material(0xb18c74),'خصلة شعر محفوظة\nA little piece of the past.');
  const sc=new THREE.Group();sc.position.set(.5,1.3,4);g.add(sc);
  const s=new THREE.Mesh(new THREE.TorusGeometry(.22,.035,8,24),gold);s.position.x=-.12;sc.add(s);
  const s2=s.clone();s2.position.x=.25;sc.add(s2);
  break;
 case 2:
  table(g,0,0,5,2);
  book(g,-1,1.2,0,0x274c68,'أفلاطون');book(g,0,1.2,0,0x563c4c,'نيتشه');book(g,1,1.2,0,0x786342,'تسلا');
  sphere(g,0,2.3,0,.48,gold,[1,1,1],'أسئلة لا تنتهي\nالفلسفة تبدأ من السؤال.');
  book(g,3,1.2,2,0x274c68,'كيف تفهم البشر؟');
  break;
 case 3:
  addWindow(g,0,-9.65);table(g,0,1,4,2);
  for(let j=0;j<6;j++)cylinder(g,-1.5+j*.6,1.3,1,.23,.23,.12,gold,'أسطوانة موسيقية');
  chair(g,-3,2);chair(g,3,2);
  textPanel(g,0,4,-4,'الموسيقى','بخت · أميرة · وأغانٍ لكل فصل.');
  break;
 case 4:
  addGlobe(g,0,2,0);table(g,-4,0,2.5,1.3);
  box(g,-4,1.5,0,.7,.8,.08,white,'أوراق السفر\nجواز سفر وتذاكر وخطط لألمانيا.');
  for(let j=0;j<2;j++)box(g,3+j*1.3,.8,0,.9,1.5,.7,material(j?0x5c7b8c:0x8b674c),'حقيبة سفر');
  book(g,0,1.3,3,0x345d79,'تعلم اللغة الألمانية');
  break;
 case 5:
  ball(g,0,.65,0);
  box(g,-3,1.4,-1,1.2,1.5,.15,material(0x243e9b),'قميص برشلونة\nحلم الطفولة أن يصبح يزن لاعب كرة قدم.');
  box(g,3,1.4,-1,1.2,1.5,.15,material(0x9e2537),'قميص يزن\nاسم صغير وحلم كبير.');
  for(let j=0;j<2;j++)box(g,-2+j*4,.25,3,.8,.35,1.6,black,'حذاء كرة قدم');
  break;
 case 6:
  for(let j=0;j<3;j++){const p=new THREE.Mesh(new THREE.ConeGeometry(1.2,2.4,4),material(0xc9b48e));p.position.set(-4+j*4,1.2,0);p.rotation.y=Math.PI/4;g.add(p)}
  for(let j=0;j<4;j++)column(g,-7+j*4,-4);
  sphere(g,0,4,3,1.1,material(0x8ebbd4),[1,.5,.3],'القمر والبحار والجليد\nتأمل في التاريخ والطبيعة والفضاء.');
  break;
 case 7:
  const sky=new THREE.Mesh(new THREE.SphereGeometry(5,32,24),new THREE.MeshBasicMaterial({color:0x101d42,side:THREE.BackSide}));
  sky.position.y=2;g.add(sky);
  for(let j=0;j<80;j++)sphere(g,(Math.random()-.5)*17,1+Math.random()*4,(Math.random()-.5)*15,.035,white);
  const star=new THREE.Mesh(new THREE.OctahedronGeometry(.8),gold);star.position.set(0,3,0);g.add(star);
  textPanel(g,0,4,-5,'القوس ♐','رمز فلكي ثقافي للتسلية، وليس تنبؤاً علمياً.');
  break;
 case 8:
  table(g,0,1,4,2);
  for(let j=0;j<3;j++)cylinder(g,-2+j*2,.7,1,.35,.35,1.3,blue,'أداة رياضية');
  ball(g,0,1.1,-1);
  break;
 case 9:
  table(g,0,0,5,2);
  for(let j=0;j<4;j++)book(g,-1.5+j,1.2,0,[0x7d3e35,0x274c68,0x64734c,0x80633c][j],'ملف بحث');
  addGlobe(g,4,2,2);
  textPanel(g,0,4,-5,'العالم','سياسة وتقنية وتحليل للأخبار.');
  break;
 case 10:
  table(g,0,0,4,2);
  book(g,-1,1.2,0,0x4c292e,'دفتر شعر');book(g,0,1.2,0,0x304a60,'كتابة');book(g,1,1.2,0,0x756044,'دفتر ملاحظات');
  box(g,2,1.3,0,.1,.9,.1,gold);sphere(g,2,1.8,0,.2,material(0xffd58c));
  break;
 case 11:
  box(g,0,.7,-2,5,.8,1.5,material(0x374b5d),'أريكة المشاهدة');
  box(g,-2,.7,0,1.3,.8,1.3,material(0x374b5d),'مقعد');
  box(g,2,.7,0,1.3,.8,1.3,material(0x374b5d),'مقعد');
  screen(g,0,2.7,-4,4.5,2.5,0x304c6b,'شاشة المشاهدة\nقصي بيطار وشريف جابر.');
  table(g,0,.5,2,1);sphere(g,0,1.2,.5,.3,material(0xf2d8a6),[1,1,1],'وعاء فشار');
  break;
 case 12:
  table(g,0,0,5,2);chair(g,-3,2);chair(g,3,2);
  box(g,0,1.4,0,1.4,.18,1,gold,'مكتب الأرشيف\nمكان للذكريات والحكايات الخاصة.');
  book(g,-1,1.6,0,0x4b3c37,'الأرشيف');book(g,1,1.6,0,0x344d62,'ملاحظات');
  textPanel(g,0,4,-5,'الأرشيف','بعض الذكريات تبقى بين السطور.');
  break;
 case 13:
  makeCat(g,4,3);
  sphere(g,0,3,0,1.1,material(0x8fb7ca),[1.3,1.3,1.3],'واحد وعشرون عاماً\nوما زالت أمامك أبواب كثيرة لم تُفتح بعد.');
  const ring=new THREE.Mesh(new THREE.TorusGeometry(1.8,.055,10,64),gold);ring.position.set(0,3,0);g.add(ring);
  textPanel(g,0,4,-5,'26 نوفمبر 2026','واحد وعشرون عاماً… وأبواب كثيرة أمامك.');
  break;
 }
}

rooms.forEach((r,i)=>{const g=buildRoom(i);decorate(g,i)});

// ممرات تربط القاعات وتسمح بالانتقال بينها
for(let i=0;i<rooms.length-1;i++){
 box(scene,(i+.5)*spacing,-.23,0,4,.3,5,marble);
}

// حركة اللاعب
let yaw=0,pitch=0,currentRoom=0,dragging=false,lastX=0,lastY=0;
const keys={},touchKeys={};
const speed=5.2;
const playerRadius=.38;

function roomIndex(){return Math.max(0,Math.min(13,Math.round(camera.position.x/spacing)))}
function updateRoom(){
 const n=roomIndex();
 if(n!==currentRoom){currentRoom=n;document.getElementById('roomName').textContent=rooms[n][0]}
}
function wallCollision(x,z){
 const idx=Math.max(0,Math.min(13,Math.round(x/spacing)));
 const localX=x-idx*spacing;
 // الجدران الجانبية والخلفية
 if(Math.abs(localX)>9.35||z< -9.35)return true;
 // الجدار الأمامي مع فتحة عبور في المنتصف
 if(z>9.35&&Math.abs(localX)>3.7)return true;
 return false;
}
function movePlayer(dt){
 const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 const move=new THREE.Vector3();
 if(keys.w||keys.ArrowUp||touchKeys.w)move.add(forward);
 if(keys.s||keys.ArrowDown||touchKeys.s)move.sub(forward);
 if(keys.d||keys.ArrowRight||touchKeys.d)move.add(right);
 if(keys.a||keys.ArrowLeft||touchKeys.a)move.sub(right);
 if(move.lengthSq()){
  move.normalize().multiplyScalar(speed*dt);
  const nx=camera.position.x+move.x,nz=camera.position.z+move.z;
  if(!wallCollision(nx,camera.position.z))camera.position.x=nx;
  if(!wallCollision(camera.position.x,nz))camera.position.z=nz;
