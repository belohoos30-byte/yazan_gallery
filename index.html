<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>متحف يزن — 21</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07182b;color:#f1fbff;font-family:Tahoma,Arial,sans-serif}
#game{position:fixed;inset:0}canvas{display:block;touch-action:none}
button,select{font:inherit}button{cursor:pointer}
#hud{position:absolute;z-index:2;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.badge,#progress{background:#071c2ddd;border:1px solid #a9d9e955;border-radius:10px;padding:9px 12px;font-size:12px;backdrop-filter:blur(8px)}
#hint{position:absolute;z-index:2;bottom:12px;left:50%;transform:translateX(-50%);background:#061a2ddd;padding:10px 14px;border-radius:12px;text-align:center;width:max-content;max-width:92%;font-size:12px;pointer-events:none}
#controls{position:absolute;z-index:3;bottom:65px;left:12px;display:grid;grid-template-columns:repeat(3,48px);gap:4px;direction:ltr}
#controls button{height:45px;padding:0;border:1px solid #fff8;border-radius:10px;background:#d5f5ffdd;color:#082238;font-size:20px;touch-action:none}
#controls button:nth-child(1){grid-column:2}
#controls button:nth-child(2){grid-column:1;grid-row:2}
#controls button:nth-child(3){grid-column:2;grid-row:2}
#controls button:nth-child(4){grid-column:3;grid-row:2}
.action{position:absolute;z-index:3;right:12px;bottom:82px;border:1px solid #d7f7ff;background:linear-gradient(135deg,#c8f2ff,#679bb9);color:#082238;border-radius:10px;padding:12px;font-weight:bold}
#music{position:absolute;z-index:3;top:55px;left:10px;width:190px;background:#071c2ddd;border:1px solid #a9d9e955;padding:9px;border-radius:10px;font-size:11px}
#music select{width:100%;margin-top:7px;padding:7px;border-radius:6px}
#music button{margin-top:6px;padding:7px 10px;border:0;border-radius:6px;background:#bdeeff;color:#082238}
#player iframe{width:170px;height:96px;border:0;margin-top:6px;border-radius:7px}
#roomNav{position:absolute;z-index:3;right:12px;top:55px}
#roomNav select{max-width:145px;padding:8px;border-radius:8px;background:#071c2ddd;color:white;border:1px solid #9bdcf0}
#intro,#modal{position:absolute;z-index:6;inset:0;display:flex;align-items:center;justify-content:center;background:#03101def;padding:18px}
#modal{display:none}
.panel{width:min(600px,100%);padding:28px;border:1px solid #a9d9e9;border-radius:18px;background:linear-gradient(145deg,#102c43,#071a30);text-align:center;max-height:90%;overflow:auto}
h1{font-size:clamp(26px,6vw,44px);color:#c7f2ff;margin:0 0 12px}
p{line-height:1.9;color:#e0f4ff}
.panel button{border:1px solid #c5efff;background:linear-gradient(135deg,#bceeff,#638fae);color:#082238;padding:12px 22px;border-radius:10px;font-weight:bold}
#close{margin-top:10px}
#crosshair{position:absolute;z-index:2;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:#eaffff;box-shadow:0 0 8px #8de6ff;transform:translate(-50%,-50%);pointer-events:none}
#progress{position:absolute;z-index:2;bottom:12px;right:12px;font-size:11px}
@media(max-width:600px){#music{width:155px}#player iframe{width:135px;height:76px}#roomNav select{max-width:125px;font-size:11px}.panel{padding:22px}}
@media(min-width:800px){#controls{bottom:18px}#interact{bottom:22px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"><div class="badge">متحف يزن · 21</div><div class="badge" id="roomName">القاعة الرئيسية</div></div>
<div id="roomNav"><select id="roomSelect" aria-label="الانتقال إلى قاعة"></select></div>
<div id="music"><b>موسيقى المتحف 🎵</b><select id="track"></select><button id="play">تشغيل</button><div id="player"></div></div>
<div id="controls">
<button data-move="forward">↑</button><button data-move="left">←</button><button data-move="back">↓</button><button data-move="right">→</button>
</div>
<button class="action" id="interact">استكشف القطعة</button>
<div id="crosshair"></div>
<div id="hint">اسحب على الشاشة للنظر حولك · استخدم الأسهم أو WASD للحركة</div>
<div id="progress">قاعة 1 من 14</div>
<div id="intro"><div class="panel">
<h1>متحف يزن</h1><p>المتحف يشبهه، مو يوثّقه.</p>
<p>أربع عشرة قاعة، ذكريات وأفكار وموسيقى ومواقف لا تحتاج إلى تفسير دائماً.</p>
<p style="font-size:12px;color:#9fc8dc">26 نوفمبر 2026 · عيد ميلاد يزن الحادي والعشرون</p>
<button id="start">دخول المتحف</button>
</div></div>
<div id="modal"><div class="panel"><h1 id="modalTitle"></h1><p id="modalText"></p><button id="close">إغلاق</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
<script type="module">
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/loaders/GLTFLoader.js';

(()=> {
'use strict';
const THREE=window.THREE;
const root=document.getElementById('game');
if(!THREE){document.getElementById('hint').textContent='تعذّر تحميل مكتبة العرض.';return;}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8ecbe3);
scene.fog=new THREE.Fog(0x8ecbe3,65,190);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,400);
camera.position.set(0,1.7,0);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
root.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe6faff,0x26384d,2.1));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-15,22,12);sun.castShadow=true;
sun.shadow.mapSize.set(1536,1536);scene.add(sun);

const mat=(color,roughness=.6,metalness=0,extra={})=>new THREE.MeshStandardMaterial({color,roughness,metalness,...extra});
const M={
wall:mat(0xd8edf1,.75),floor:mat(0xe9f2f2,.24,.18),trim:mat(0x8fc7dc,.3,.55),
silver:mat(0xcbdde6,.22,.8),blue:mat(0x397ca7,.35,.35),dark:mat(0x10263c,.7),
wood:mat(0x684b38,.8),gold:mat(0xbda66d,.28,.7),black:mat(0x111820,.4),
glass:mat(0x85d9f5,.12,.25,{transparent:true,opacity:.4}),
glow:mat(0x8de6ff,.2,.2,{emissive:0x2a9bc4,emissiveIntensity:.65}),
white:mat(0xf4f8fa,.4),red:mat(0x9b3148,.4),green:mat(0x3b7954,.5),
rubber:mat(0x171b20,.9),screen:mat(0x152f40,.18,.15,{emissive:0x102b42,emissiveIntensity:.35})
};

const rooms=[
['القاعة الرئيسية',0,'أهلاً بك في متحف يزن.'],
['الطفولة والألعاب',24,'هنا تعيش ألعاب الطفولة وشاشات الماضي وعالم الطباشير.'],
['الفلسفة والتفكير',48,'أسئلة عن الحياة والإنسان والمعنى.'],
['الموسيقى والطرب',72,'أسطوانات وأغانٍ وليل ومطر.'],
['السفر وألمانيا',96,'ألمانيا، خرائط وحقائب وأشياء لم تُحسم بعد.'],
['برشلونة وكرة القدم',120,'حلم الملعب وقميص برشلونة وذكريات الكرة.'],
['التاريخ والحضارات',144,'مصر القديمة واليونان والقمر والجليد والمحيط.'],
['الفلك والأبراج',168,'السماء والكواكب ورموز الأبراج.'],
['الرياضة واللياقة',192,'أجهزة وأوزان وأدوات تدريب.'],
['مكتب التحليل والملفات',216,'أخبار وأسئلة وملفات تحتاج إلى تدقيق.'],
['الشعر والكتابة',240,'دفتر وقلم ولمسات من الشعر العراقي.'],
['المشاهدة',264,'كنبة وبوشار وشاشة ومحتوى متنوع.'],
['المنظمة السرية والذكريات',288,'مكتب الرئيس والملفات السرية ومواقف لا تُنسى.'],
['القاعة الأخيرة',312,'واحد وعشرون عاماً… وما زالت أمامك أبواب كثيرة لم تُفتح بعد.']
].map(r=>({name:r[0],x:r[1],desc:r[2]}));

const interactables=[];
const clock=new THREE.Clock();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function box(w,h,d,material,x,y,z,g=scene){
const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;g.add(o);return o;
}
function cyl(rt,rb,h,material,x,y,z,g=scene,n=24){
const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,n),material);
o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;g.add(o);return o;
}
function ball(r,material,x,y,z,g=scene){
const o=new THREE.Mesh(new THREE.SphereGeometry(r,24,16),material);
o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;g.add(o);return o;
}
function ellipsoid(g,x,y,z,sx,sy,sz,material){
const o=ball(1,material,x,y,z,g);o.scale.set(sx,sy,sz);return o;
}
function rod(g,a,b,r,material){
const d=new THREE.Vector3().subVectors(b,a);
const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),10),material);
o.position.copy(a).add(b).multiplyScalar(.5);
o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
o.castShadow=true;g.add(o);return o;
}
function groupAt(g,x,z){const q=new THREE.Group();q.position.set(x,0,z);g.add(q);return q;}

function register(g,title,description,mesh){
interactables.push({mesh,title,description});
mesh.userData.interaction=true;return mesh;
}
function label(g,title,description,x,y,z,w=2.5,h=.65){
const c=document.createElement('canvas');c.width=512;c.height=150;
const ctx=c.getContext('2d');
ctx.fillStyle='#102c43';ctx.fillRect(0,0,512,150);
ctx.strokeStyle='#bcecff';ctx.lineWidth=7;ctx.strokeRect(5,5,502,140);
ctx.fillStyle='#effaff';ctx.textAlign='center';ctx.textBaseline='middle';
ctx.font='bold 34px Tahoma';ctx.fillText(title,256,75,470);
const texture=new THREE.CanvasTexture(c);texture.colorSpace=THREE.SRGBColorSpace;
const face=box(w,h,.035,new THREE.MeshBasicMaterial({map:texture}),x,y,z,g);
register(g,title,description,face);return face;
}
function column(g,x,z){
cyl(.35,.48,6,M.trim,x,3,z,g);
cyl(.55,.55,.25,M.silver,x,.15,z,g);
cyl(.55,.55,.25,M.silver,x,5.9,z,g);
}
function chandelier(g){
cyl(.12,.12,.8,M.gold,0,7,0,g);
for(let i=0;i<8;i++){
const a=i*Math.PI/4;
rod(g,new THREE.Vector3(0,6.8,0),new THREE.Vector3(Math.cos(a)*1.2,6.3,Math.sin(a)*1.2),.07,M.gold);
ball(.16,M.glow,Math.cos(a)*1.2,5.9,Math.sin(a)*1.2,g);
}
ball(.35,M.glow,0,6.8,0,g);
}

function buildShell(room){
const g=new THREE.Group();g.position.set(room.x,0,0);scene.add(g);
box(22,.4,22,M.floor,0,-.25,0,g);
box(22,8,.6,M.wall,0,4,-11,g);
box(22,8,.6,M.wall,0,4,11,g);
for(const side of [-1,1]){
box(.6,8,8,M.wall,side*11,4,-7,g);
box(.6,8,8,M.wall,side*11,4,7,g);
box(.6,2,6,M.wall,side*11,7,0,g);
box(.35,5.8,.35,M.trim,side*10.7,2.9,-3,g);
box(.35,5.8,.35,M.trim,side*10.7,2.9,3,g);
box(.45,.35,6.3,M.silver,side*10.7,5.8,0,g);
}
for(const x of [-9,9]){column(g,x,-9.8);column(g,x,9.8);}
box(22,.35,.65,M.trim,0,7.9,0,g);
box(22,.25,.65,M.trim,0,.05,0,g);
chandelier(g);
label(g,room.name,room.desc,0,5.4,-10.3,5,1.1);
return g;
}
function shelf(g,x,z){
box(3,.18,.8,M.wood,x,1,z,g);box(3,.18,.8,M.wood,x,2,z,g);
box(.15,2.3,.8,M.wood,x-1.45,1.1,z,g);box(.15,2.3,.8,M.wood,x+1.45,1.1,z,g);
}
function chair(g,x,z){
box(1.5,.25,1.3,M.wood,x,.7,z,g);box(1.5,1.4,.25,M.wood,x,1.35,z-.55,g);
for(const dx of [-.6,.6])for(const dz of [-.45,.45])cyl(.06,.06,.7,M.dark,x+dx,.3,z+dz,g);
}

function makeCRT(g,x,z){
const q=groupAt(g,x,z);
box(2.65,2.05,1.55,M.black,0,1.55,0,q);
box(2.38,1.72,.08,mat(0x253d4b,.2),0,1.58,.81,q);
const glass=ellipsoid(q,0,1.58,.87,1.08,.72,.12,M.screen);
box(.55,.045,.018,M.glow,-.35,1.95,.99,q);
for(let i=0;i<3;i++)cyl(.075,.075,.08,M.silver,.91+i*.18,1.12,.86,q,16);
box(1.1,.25,.8,M.black,0,.35,.1,q);
box(3,.12,1.65,M.wood,0,.12,.15,q);
for(let r=0;r<3;r++)for(let c=0;c<11;c++)box(.105,.035,.09,M.silver,-.72+c*.14,.37,1.12+r*.14,q);
ellipsoid(q,1.15,.35,1.35,.16,.08,.23,M.black);
register(q,'كمبيوتر LG القديم','كمبيوتر CRT قديم مع لوحة مفاتيح وماوس. ذكرى من زمن ألعاب الكمبيوتر.',q);
return q;
}
function makeTV(g,x,z){
const q=groupAt(g,x,z);
box(3.1,2.25,1.8,M.black,0,1.65,0,q);
box(2.78,1.88,.1,M.dark,0,1.7,.94,q);
const glass=ellipsoid(q,0,1.7,1.01,1.28,.82,.13,M.screen);
for(let i=0;i<3;i++)cyl(.1,.1,.12,M.silver,1.35,1.9-i*.3,.97,q);
rod(q,new THREE.Vector3(0,2.8,0),new THREE.Vector3(-.7,3.65,0),.035,M.silver);
rod(q,new THREE.Vector3(0,2.8,0),new THREE.Vector3(.7,3.65,0),.035,M.silver);
register(q,'تلفزيون CRT قديم','تلفزيون بصندوق عميق وشاشة زجاجية وأزرار وهوائي.',q);
}
function makeConsole(g,x,z,type='PS1'){
const q=groupAt(g,x,z);
if(type==='PS1'){
box(1.8,.42,1.8,mat(0xaaa9a0,.55),0,.55,0,q);
cyl(.55,.55,.055,M.dark,0,.79,-.05,q,40);
cyl(.43,.43,.06,mat(0x9ba7b0,.3,.6),0,.83,-.05,q,40);
box(.45,.07,.12,M.black,0,.81,.76,q);
ball(.08,M.green,-.68,.8,.72,q);ball(.08,M.blue,.68,.8,.72,q);
}else{
box(1.1,2.25,.75,mat(0x171b20,.35,.2),0,1.25,0,q);
for(let i=0;i<7;i++)box(.035,1.75,.04,M.silver,-.43+i*.14,1.25,.39,q);
cyl(.09,.09,.06,M.glow,0,.25,.4,q,16);
}
register(q,type,type==='PS1'?'جهاز PlayStation الأول الرمادي المسطح.':'جهاز PlayStation 2 الأسود العمودي.',q);
}
function makeController(g,x,y,z){
const q=new THREE.Group();q.position.set(x,y,z);g.add(q);
ellipsoid(q,0,0,0,.48,.12,.28,M.black);
ellipsoid(q,-.29,-.08,.03,.18,.11,.24,M.black);ellipsoid(q,.29,-.08,.03,.18,.11,.24,M.black);
box(.16,.035,.06,M.silver,-.19,.12,0,q);box(.06,.035,.16,M.silver,-.19,.12,0,q);
for(const [dx,dz,c] of [[.23,-.08,0xd64b52],[.34,.02,0x4d83bd],[.23,.12,0x58a76b],[.12,.02,0xd6c36a]])ball(.055,mat(c),dx,.13,dz,q);
register(q,'يد تحكم','يد تحكم ألعاب بأزرارها المعروفة.',q);
}
function makeDisc(g,x,y,z){
const q=groupAt(g,x,z);
cyl(.72,.72,.07,mat(0x777f89,.2,.8),0,y,0,q,64);
cyl(.54,.54,.012,mat(0xb8c9d6,.18,.85),0,y+.045,0,q,64);
cyl(.15,.15,.09,M.black,0,y,0,q,32);
register(q,'قرص ألعاب','قرص ألعاب دائري بسطح معدني وثقب مركزي.',q);
}
function makeShirt(g,x,z){
const q=groupAt(g,x,z);
const torso=box(1.35,1.65,.22,M.blue,0,1.65,0,q);
const l=box(.55,.72,.22,M.blue,-.92,2.05,0,q);l.rotation.z=-.28;
const r=box(.55,.72,.22,M.blue,.92,2.05,0,q);r.rotation.z=.28;
box(.28,1.6,.235,M.red,-.35,1.65,.13,q);box(.28,1.6,.235,M.red,.35,1.65,.13,q);
const collar=new THREE.Mesh(new THREE.TorusGeometry(.22,.07,8,24,Math.PI),M.white);
collar.position.set(0,2.48,.12);collar.rotation.x=Math.PI/2;q.add(collar);
ball(.13,M.gold,.43,2.12,.15,q);
register(q,'قميص برشلونة','قميص كرة قدم بألوان برشلونة وشارة صغيرة.',q);
}
function makeSoccerBall(g,x,y,z){
const q=groupAt(g,x,z);
const b=ball(.72,M.white,0,y,0,q);
const black=mat(0x171b20,.7);
const pentagon=new THREE.Shape();
for(let i=0;i<5;i++){const a=i*Math.PI*2/5-Math.PI/2;const px=Math.cos(a)*.2,py=Math.sin(a)*.2;i===0?pentagon.moveTo(px,py):pentagon.lineTo(px,py);}
pentagon.closePath();
const patch=new THREE.Mesh(new THREE.ShapeGeometry(pentagon),black);
patch.position.set(0,y,.69);q.add(patch);
register(q,'كرة قدم','كرة قدم بيضاء مع لوحة سوداء ظاهرة.',b);
}
function makePyramid(g,x,z,size=1.7){
const q=groupAt(g,x,z);
const p=new THREE.Mesh(new THREE.ConeGeometry(size,3.2,4),mat(0xc4ae83,.92));
p.position.y=1.6;p.rotation.y=Math.PI/4;p.castShadow=true;q.add(p);
box(size*1.5,.18,size*1.5,mat(0x9f8b6a),0,.08,0,q);
register(q,'هرم مصري','مجسم هرمي رباعي مستوحى من أهرامات مصر.',q);
}
function makeCat(g,x,z){
const q=groupAt(g,x,z);
const fur=mat(0xc99a61,.9),darkFur=mat(0x9a7047,.9),eye=mat(0xa77b2d,.25);
const body=ellipsoid(q,0,.72,0,.62,.42,.95,fur);
ellipsoid(q,0,1.08,-.55,.43,.43,.43,fur);
for(const dx of [-.27,.27]){
const ear=new THREE.Mesh(new THREE.ConeGeometry(.18,.42,4),fur);
ear.position.set(dx,1.52,-.67);q.add(ear);
ball(.07,mat(0xd28c85),dx,1.48,-.69,q);
}
for(const dx of [-.16,.16]){
ball(.09,eye,dx,1.13,-.93,q);ball(.045,M.black,dx,1.13,-1.005,q);
ball(.018,M.white,dx-.02,1.16,-1.04,q);
}
ball(.055,mat(0x9f6862),0,1.02,-.99,q);
for(const dx of [-.38,.38])for(const dz of [-.58,.58]){
ellipsoid(q,dx,.28,dz,.13,.32,.14,fur);ellipsoid(q,dx,.1,dz-.02,.15,.1,.19,darkFur);
}
const curve=new THREE.CatmullRomCurve3([new THREE.Vector3(0,.8,.78),new THREE.Vector3(.3,1.15,1.05),new THREE.Vector3(.55,1.5,.95),new THREE.Vector3(.7,1.45,.65)]);
q.add(new THREE.Mesh(new THREE.TubeGeometry(curve,24,.095,8,false),fur));
register(q,'بسبوس 🐈','بسبوس قط أشقر رملي بعينين عسليتين. يظهر في الاستقبال والقاعة الأخيرة.',q);
}
function makeCar(g,x,z,color=0x245d86){

/* تحميل المجسمات الخارجية مع إبقاء المجسم البديل */
const loader=new GLTFLoader();
function loadModel(url,parent,position,targetHeight,title,description,fallback){
const placeholder=fallback();
const group=new THREE.Group();group.position.copy(position);parent.add(group);
group.add(placeholder);
loader.load(url,gltf=>{
const model=gltf.scene;
model.updateMatrixWorld(true);
const bounds=new THREE.Box3().setFromObject(model);
const size=bounds.getSize(new THREE.Vector3());
const center=bounds.getCenter(new THREE.Vector3());
const scale=targetHeight/Math.max(size.y,.001);
model.scale.setScalar(scale);
model.position.set(-center.x*scale,-bounds.min.y*scale,-center.z*scale);
group.remove(placeholder);
group.add(model);
model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
register(group,title,description,group);
},undefined,()=>{
document.getElementById('hint').textContent='تعذّر تحميل أحد المجسمات الخارجية؛ تم الإبقاء على المجسم البديل.';
});
return group;
}

/* الحركة والنظر */
let yaw=0,pitch=0,drag=false,lastX=0,lastY=0;
const keys={},move={forward:false,back:false,left:false,right:false};
renderer.domElement.addEventListener('pointerdown',e=>{
if(e.button!==0)return;drag=true;lastX=e.clientX;lastY=e.clientY;
renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointerup',()=>drag=false);
renderer.domElement.addEventListener('pointercancel',()=>drag=false);
renderer.domElement.addEventListener('pointermove',e=>{
if(!drag)return;
const dx=e.clientX-lastX,dy=e.clientY-lastY;
yaw-=dx*.004;pitch=clamp(pitch-dy*.003,-1.15,1.15);
lastX=e.clientX;lastY=e.clientY;
});
addEventListener('keydown',e=>{
const k=e.key.toLowerCase();keys[k]=true;
if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('blur',()=>{
Object.keys(keys).forEach(k=>keys[k]=false);
Object.keys(move).forEach(k=>move[k]=false);
});
document.querySelectorAll('[data-move]').forEach(b=>{
const k=b.dataset.move;
b.addEventListener('pointerdown',e=>{e.preventDefault();move[k]=true;});
['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>move[k]=false));
});

function clampPosition(){
const maxX=rooms[rooms.length-1].x+10.2;
camera.position.x=clamp(camera.position.x,-10.2,maxX);
const nearest=Math.round(camera.position.x/24)*24;
const localX=camera.position.x-nearest;
if(Math.abs(localX)<=10.2)camera.position.z=clamp(camera.position.z,-10.2,10.2);
else camera.position.z=clamp(camera.position.z,-2.65,2.65);
}
const selectRoom=document.getElementById('roomSelect');
rooms.forEach((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=r.name;selectRoom.appendChild(o);});
function currentRoom(){return clamp(Math.round(camera.position.x/24),0,rooms.length-1);}
function updateRoom(){
const i=currentRoom();
document.getElementById('roomName').textContent=rooms[i].name;
document.getElementById('progress').textContent='قاعة '+(i+1)+' من '+rooms.length;
selectRoom.value=String(i);
}
selectRoom.addEventListener('change',()=>{
const i=Number(selectRoom.value);
camera.position.set(rooms[i].x,1.7,0);yaw=0;pitch=0;updateRoom();
});
function animate(){
requestAnimationFrame(animate);
const dt=Math.min(clock.getDelta(),.04);
camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;
const speed=7*dt;
const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
if(keys.w||keys.arrowup||move.forward)camera.position.addScaledVector(forward,speed);
if(keys.s||keys.arrowdown||move.back)camera.position.addScaledVector(forward,-speed);
if(keys.a||keys.arrowleft||move.left)camera.position.addScaledVector(right,-speed);
if(keys.d||keys.arrowright||move.right)camera.position.addScaledVector(right,speed);
camera.position.y=1.7;clampPosition();updateRoom();
renderer.render(scene,camera);
}
animate();

let obj=hit.object;

if(obj){chosen=interactables.find(o=>o.mesh===obj);if(chosen)break;}
chosen=interactables.find(o=>o.mesh===hit.object);

function stopMusic(){
document.getElementById('player').replaceChildren();
playing=false;document.getElementById('play').textContent='تشغيل';
}
document.getElementById('play').onclick=()=>{
const player=document.getElementById('player');
if(playing){stopMusic();return;}
const id=track.value;if(!id)return;
const iframe=document.createElement('iframe');
iframe.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?autoplay=1&controls=1&rel=0';
iframe.title='موسيقى المتحف';iframe.allow='autoplay; encrypted-media; picture-in-picture';
iframe.allowFullscreen=true;player.replaceChildren(iframe);
playing=true;document.getElementById('play').textContent='إيقاف';
};
track.onchange=stopMusic;
addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
})();
</script>
</body>
</html>
