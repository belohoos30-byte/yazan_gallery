<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>متحف يزن | 21</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100b0c;color:#f5e8d0;font-family:Tahoma,Arial,sans-serif}
#scene{position:fixed;inset:0}
#hud{position:fixed;inset:0;pointer-events:none}
#top{position:absolute;top:15px;right:15px;left:15px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.badge{background:#160e10d9;border:1px solid #a7834b88;padding:10px 14px;border-radius:8px;font-size:12px;backdrop-filter:blur(8px)}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;color:#e8c98a;opacity:.75}
#hint{position:absolute;bottom:115px;left:50%;transform:translateX(-50%);background:#160e10e8;border:1px solid #a7834b;padding:12px 18px;border-radius:8px;text-align:center;font-size:13px;max-width:90%;display:none}
#intro{position:fixed;inset:0;background:linear-gradient(#090607b8,#090607f2),radial-gradient(ellipse at center,#69422b,#100b0c 70%);z-index:10;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px}
.panel{max-width:520px}
.panel h1{font-size:clamp(32px,8vw,58px);color:#e7c58a;margin:0 0 10px;text-shadow:0 4px 25px #000}
.panel p{line-height:2;color:#e0d1bd}
button{font:inherit;cursor:pointer}
.gold{background:linear-gradient(135deg,#e6c88f,#a77a3d);color:#20140d;border:0;border-radius:7px;padding:13px 25px;font-weight:bold}
#info{position:fixed;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90%,440px);padding:23px;background:#170f10f2;border:1px solid #c6a269;border-radius:12px;display:none;text-align:center;box-shadow:0 15px 60px #000}
#info h2{color:#e7c58a;margin-top:0}
#info p{line-height:1.9;color:#e4d8c7}
#close{margin-top:10px}
#controls{position:fixed;bottom:15px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.pad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;gap:5px;pointer-events:auto}
.ctrl{background:#1b1110bb;border:1px solid #b8955d99;color:#f1d7a4;border-radius:12px;font-size:18px;touch-action:none}
#look{font-size:11px;opacity:.8;max-width:125px;text-align:center;line-height:1.6}
#use{pointer-events:auto;padding:13px 17px;border-radius:10px;background:#a9824b;color:#160f0b;border:0;font-weight:bold}
@media(hover:hover) and (pointer:fine){#controls{opacity:.5}#controls:hover{opacity:1}}
</style>
</head>
<body>
<div id="scene"></div>

<div id="hud">
  <div id="top">
    <div class="badge">متحف يزن · 21</div>
    <div class="badge" id="roomName">البهو الرئيسي</div>
  </div>
  <div id="cross">+</div>
  <div id="hint"></div>
  <div id="controls">
    <div class="pad">
      <span></span><button class="ctrl" data-move="forward">▲</button><span></span>
      <button class="ctrl" data-move="left">◀</button><button class="ctrl" data-move="back">▼</button><button class="ctrl" data-move="right">▶</button>
      <span></span><button class="ctrl" data-move="up">＋</button><span></span>
    </div>
    <div id="look">اسحب الشاشة للنظر حولك<br>اقترب من المقتنيات لتكتشفها</div>
    <button id="use">تفاعل</button>
  </div>
</div>

<div id="intro">
  <div class="panel">
    <h1>متحف يزن</h1>
    <p>واحد وعشرون عاماً…<br>وحكايات كثيرة لا تكفيها غرفة واحدة.</p>
    <p>أنت الآن عند مدخل المتحف.<br>انظر حولك، تحرّك، واكتشف التفاصيل بنفسك.</p>
    <button class="gold" id="enter">ادخل المتحف</button>
  </div>
</div>

<div id="info">
  <h2 id="infoTitle"></h2>
  <p id="infoText"></p>
  <button class="gold" id="close">إغلاق</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
'use strict';

const host=document.getElementById('scene');

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,100);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

host.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffdfbd,0x20151a,1.35));
const ambient=new THREE.AmbientLight(0xffd5a0,.25);
scene.add(ambient);

function light(x,y,z,color=0xffd49a,power=2,range=12){
 const l=new THREE.PointLight(color,power,range);
 l.position.set(x,y,z);scene.add(l);return l;
}

light(8,4,-12,0xffc58b,2,16);

const wall=mat(0x392326),dark=mat(0x211516),wood=mat(0x4b2b20),gold=mat(0xc39a58,.35,.65),marble=mat(0xb9a99a,.35),blue=mat(0x183d60),red=mat(0x762d35),black=mat(0x15191d),white=mat(0xe6d8c1);

function box(w,h,d,m,x,y,z){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
 o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o;
}
function cylinder(rt,rb,h,m,x,y,z,segments=24){

function textTexture(title,sub=''){
 const c=document.createElement('canvas');c.width=512;c.height=320;
 const g=c.getContext('2d');
 g.fillStyle='#241719';g.fillRect(0,0,512,320);
 g.strokeStyle='#c9a66c';g.lineWidth=13;g.strokeRect(14,14,484,292);
 g.strokeStyle='#765437';g.lineWidth=3;g.strokeRect(30,30,452,260);
 g.textAlign='center';g.fillStyle='#f0d6a3';g.font='bold 43px Tahoma';
 g.fillText(title,256,145);
 g.fillStyle='#d4c3a9';g.font='25px Tahoma';g.fillText(sub,256,200);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
function painting(title,sub,x,y,z,rot=0){
 const frame=box(2.2,1.55,.15,gold,x,y,z);
 frame.rotation.y=rot;
 const pic=new THREE.Mesh(new THREE.PlaneGeometry(1.92,1.27),new THREE.MeshBasicMaterial({map:textTexture(title,sub)}));
 pic.position.set(x,y,z+.09);pic.rotation.y=rot;scene.add(pic);
 return frame;
}
function carpet(x,z,w=5,d=7){
 box(w,.07,d,red,x,.04,z);
 for(let i=0;i<4;i++){
  box(w-.25,.015,.035,gold,x,.09,z-d/2+.35+i*.13);
  box(w-.25,.015,.035,gold,x,.09,z+d/2-.35-i*.13);
 }
}
function chandelier(x,z){

 for(let i=0;i<6;i++){
  const a=i*Math.PI/3;

  sphere(.13,mat(0xffd99a,.25),x+Math.cos(a)*.65,4.05,z+Math.sin(a)*.65);
 }
 sphere(.18,gold,x,4.25,z);
}
function roomShell(x,z,w,d,name){

  box(.16,4.8,.2,gold,x+i*w/3,2.5,z-d/2+.2);
 }

/* حركة الكاميرا والتفاعل */
let yaw=0,pitch=0,locked=false,started=false;
const keys={};
const velocity=new THREE.Vector3();
const direction=new THREE.Vector3();
const raycaster=new THREE.Raycaster();
const hint=document.getElementById('hint');
let target=null;

function showInfo(title,desc){
 document.getElementById('infoTitle').textContent=title;
 document.getElementById('infoText').textContent=desc;
 document.getElementById('info').style.display='block';
}
document.getElementById('close').onclick=()=>document.getElementById('info').style.display='none';

function findTarget(){
 raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
 const hits=raycaster.intersectObjects(interactives,true);
 target=null;
 for(const hit of hits){
  let obj=hit.object;
  while(obj && !obj.userData.title)obj=obj.parent;
  if(obj && obj.userData.title && hit.distance<4.2){target=obj;break;}
 }
 if(target){
  hint.style.display='block';
  hint.textContent='اضغط «تفاعل» لاكتشاف: '+target.userData.title;
 }else hint.style.display='none';
}
function interact(){
 if(target)showInfo(target.userData.title,target.userData.desc);
}
document.getElementById('use').onclick=interact;
renderer.domElement.addEventListener('click',()=>{
 if(!('ontouchstart' in window) && !locked && started){
  renderer.domElement.requestPointerLock?.();
 }
});
document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===renderer.domElement);
document.addEventListener('mousemove',e=>{
 if(!locked)return;
 yaw-=e.movementX*.002;
 pitch-=e.movementY*.002;
 pitch=Math.max(-1.25,Math.min(1.25,pitch));
});
document.addEventListener('keydown',e=>keys[e.code]=true);
document.addEventListener('keyup',e=>keys[e.code]=false);

/* سحب اللمس للنظر */
let touchLook=null;
renderer.domElement.addEventListener('touchstart',e=>{
 if(e.touches.length===1){
  touchLook={x:e.touches[0].clientX,y:e.touches[0].clientY};
 }
},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{
 if(!touchLook||e.touches.length!==1)return;
 const t=e.touches[0];
 const dx=t.clientX-touchLook.x,dy=t.clientY-touchLook.y;
 yaw-=dx*.005;
 pitch-=dy*.004;
 pitch=Math.max(-1.2,Math.min(1.2,pitch));
 touchLook={x:t.clientX,y:t.clientY};
},{passive:true});
renderer.domElement.addEventListener('touchend',()=>touchLook=null);

/* أزرار الحركة للموبايل */
const pressed={};
document.querySelectorAll('[data-move]').forEach(btn=>{
 const name=btn.dataset.move;
 btn.addEventListener('pointerdown',e=>{e.preventDefault();pressed[name]=true;btn.setPointerCapture(e.pointerId)});
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>btn.addEventListener(ev,()=>pressed[name]=false));
});

function movement(dt){
 const speed=4.2*dt;
 let forward=0,side=0;
 if(keys.KeyW||keys.ArrowUp||pressed.forward)forward+=1;
 if(keys.KeyS||keys.ArrowDown||pressed.back)forward-=1;
 if(keys.KeyA||keys.ArrowLeft||pressed.left)side-=1;
 if(keys.KeyD||keys.ArrowRight||pressed.right)side+=1;
 if(pressed.up)camera.position.y=Math.min(2.2,camera.position.y+speed);
 const len=Math.hypot(forward,side)||1;
 forward/=len;side/=len;
 const dx=(-Math.sin(yaw)*forward+Math.cos(yaw)*side)*speed;
 const dz=(-Math.cos(yaw)*forward-Math.sin(yaw)*side)*speed;
 const nx=camera.position.x+dx,nz=camera.position.z+dz;
 camera.position.x=Math.max(-29,Math.min(29,nx));
 camera.position.z=Math.max(-173,Math.min(3,nz));
 camera.position.y=1.65;
}

function updateRoom(){
 const z=camera.position.z;
 let name='البهو الرئيسي';
 if(camera.position.x < -14)name='جناح الذكريات';
 else if(camera.position.x > 14)name='جناح الأفكار';
 else if(z<-20&&z>-40)name=camera.position.x<0?'الموسيقى':'الرحلات';
 else if(z<=-40&&z>-60)name='كرة القدم';
 else if(z<=-60&&z>-82)name='التاريخ والكون';
 else if(z<=-82&&z>-108)name='التفاصيل والذكريات';
 else if(z<=-108&&z>-132)name='أشياء تشبهه';
 else if(z<=-132&&z>-156)name='الأرشيف';
 else if(z<=-156)name='المستقبل والتقنية';
 document.getElementById('roomName').textContent=name;
}

let last=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.04);last=now;
 if(started){
  movement(dt);
  camera.rotation.order='YXZ';
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;
  findTarget();
  updateRoom();
 }
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

document.getElementById('enter').onclick=()=>{
 started=true;
 document.getElementById('intro').style.display='none';
 if(!('ontouchstart' in window))renderer.domElement.requestPointerLock?.();
};
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
})();
</script>
